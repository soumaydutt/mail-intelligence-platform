name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: verified-api-package
          path: target/mailguard-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test -- --reporter=default --reporter=junit --outputFile=../target/evidence/frontend-unit.xml
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-and-dashboard-reports
          path: |
            target/surefire-reports/
            target/evidence/
            frontend/playwright-report/
          if-no-files-found: error

  production-smoke:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-api-package
          path: target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require real container services
        run: docker info && docker compose version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: |
          mkdir -p target/evidence
          node --test --test-reporter=junit --test-reporter-destination=target/evidence/backup.xml scripts/backup/backup.test.mjs
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        id: filesystem_scan
        continue-on-error: true
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: frontend/node_modules,target,frontend/dist
          skip-files: pom.xml
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: target/evidence/filesystem-scan.json
      - run: docker build --target packaged -t mailguard-api:ci .
      - run: docker build -f frontend/Dockerfile -t mailguard-proxy:ci .
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/prod/verify.mjs --no-build
        if: github.event_name != 'workflow_dispatch'
      - run: node scripts/prod/verify.mjs --load --no-build
        if: github.event_name == 'workflow_dispatch'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        id: api_image_scan
        continue-on-error: true
        with:
          image-ref: mailguard-api:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          skip-setup-trivy: true
          format: json
          output: target/evidence/api-scan.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        id: proxy_image_scan
        continue-on-error: true
        with:
          image-ref: mailguard-proxy:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          skip-setup-trivy: true
          format: json
          output: target/evidence/proxy-scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-production-browser
          path: |
            frontend/test-results/
            target/evidence/
          if-no-files-found: ignore
      - name: Require clean security scans
        run: test "${{ steps.filesystem_scan.outcome }}" = success && test "${{ steps.api_image_scan.outcome }}" = success && test "${{ steps.proxy_image_scan.outcome }}" = success
