spring.application.name=MailGuard

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
jobs.api-key=${JOBS_API_KEY:}
jobs.max-attempts=${JOBS_MAX_ATTEMPTS:3}
jobs.max-outstanding=${JOBS_MAX_OUTSTANDING:20000}
jobs.worker.enabled=${JOBS_WORKER_ENABLED:false}
jobs.worker.concurrency=${JOBS_WORKER_CONCURRENCY:20}
jobs.worker.lease-seconds=${JOBS_WORKER_LEASE_SECONDS:30}
jobs.worker.poll-millis=${JOBS_WORKER_POLL_MILLIS:250}
jobs.worker.shutdown-seconds=${JOBS_WORKER_SHUTDOWN_SECONDS:10}


# Resolved exception warnings include rejected email values and untrusted request paths.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
