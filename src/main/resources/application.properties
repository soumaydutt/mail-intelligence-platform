spring.application.name=MailGuard

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
jobs.api-key=${JOBS_API_KEY:}
jobs.max-attempts=${JOBS_MAX_ATTEMPTS:3}
jobs.max-outstanding=${JOBS_MAX_OUTSTANDING:20000}
jobs.worker.enabled=${JOBS_WORKER_ENABLED:false}
jobs.worker.concurrency=${JOBS_WORKER_CONCURRENCY:20}
jobs.worker.lease-seconds=${JOBS_WORKER_LEASE_SECONDS:30}
jobs.worker.poll-millis=${JOBS_WORKER_POLL_MILLIS:250}
jobs.worker.shutdown-seconds=${JOBS_WORKER_SHUTDOWN_SECONDS:10}
delivery.source-id=${DELIVERY_SOURCE_ID:}
delivery.fresh-days=${DELIVERY_FRESH_DAYS:30}
spring.data.redis.host=${VALKEY_HOST:127.0.0.1}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.username=${VALKEY_USERNAME:}
spring.data.redis.password=${VALKEY_PASSWORD:}
spring.data.redis.ssl.enabled=${VALKEY_TLS:false}
spring.data.redis.connect-timeout=${VALKEY_CONNECT_TIMEOUT:200ms}
spring.data.redis.timeout=${VALKEY_COMMAND_TIMEOUT:200ms}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${VALKEY_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${VALKEY_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=${VALKEY_POOL_MAX_WAIT:200ms}
spring.data.redis.repositories.enabled=false
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health}
management.health.redis.enabled=${VALKEY_HEALTH_ENABLED:false}
valkey.namespace=${VALKEY_NAMESPACE:local}
dns.cache.enabled=${DNS_CACHE_ENABLED:false}
dns.cache.positive-ttl-seconds=${DNS_CACHE_POSITIVE_TTL_SECONDS:30}
dns.cache.negative-ttl-seconds=${DNS_CACHE_NEGATIVE_TTL_SECONDS:5}
dns.cache.max-entry-bytes=${DNS_CACHE_MAX_ENTRY_BYTES:8192}
dns.cache.max-inflight=${DNS_CACHE_MAX_INFLIGHT:128}
dns.cache.wait-millis=${DNS_CACHE_WAIT_MILLIS:2500}

spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=17MB
imports.max-upload-bytes=${IMPORTS_MAX_UPLOAD_BYTES:16777216}
imports.max-record-chars=${IMPORTS_MAX_RECORD_CHARS:2048}
imports.max-email-chars=${IMPORTS_MAX_EMAIL_CHARS:255}
imports.max-rows=${IMPORTS_MAX_ROWS:50000}
imports.batch-size=${IMPORTS_BATCH_SIZE:250}
imports.max-concurrent-uploads=${IMPORTS_MAX_CONCURRENT_UPLOADS:2}
imports.results-page-size=${IMPORTS_RESULTS_PAGE_SIZE:500}
imports.stale-minutes=${IMPORTS_STALE_MINUTES:60}
imports.worker.poll-millis=${IMPORTS_WORKER_POLL_MILLIS:500}

# Resolved exception warnings include rejected email values and untrusted request paths.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR