<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Error boundary reload regression</title>
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement } from 'react'
      import { createRoot } from 'react-dom/client'
      import ErrorBoundary from '../../../src/app/ErrorBoundary.tsx'

      const recovered = sessionStorage.getItem('error-boundary-attempted') === 'true'
      sessionStorage.setItem('error-boundary-attempted', 'true')
      function BrokenView() {
        throw new Error('private-render-failure@example.invalid')
      }
      createRoot(document.getElementById('root')).render(createElement(ErrorBoundary, null,
        recovered ? createElement('p', null, 'Dashboard recovered after reload.') : createElement(BrokenView)))
    </script>
  </body>
</html>
